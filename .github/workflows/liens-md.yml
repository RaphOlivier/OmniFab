name: Controle des liens Markdown

# Verifie que tous les liens relatifs des .md du depot existent (README, docs/, AGENTS.md).
# ACTIVE le 2026-10-28 : CI repassee au vert (lock d5b4b2c, OCCT 7.8 builtin)
# declenchement sur push de fichiers .md + declenchement manuel conserve.
# Ne cree PAS d'issue : echec visible dans Actions.
# 2026-10-26 (audit n°3, D5) : decodage de l'encodage percent (%20 etc.) et
# couverture des liens de reference ([texte][ref] + definitions [ref]: cible).

on:
  push:
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    name: liens relatifs .md (docs/, README, AGENTS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verification des liens relatifs
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, sys, urllib.parse

          casses = []
          fichiers = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('target', '.git')]
              for f in files:
                  if f.endswith('.md'):
                      fichiers.append(os.path.join(root, f))

          def existe(base, cible):
              cible = urllib.parse.unquote(cible)
              return os.path.exists(os.path.join(base, cible))

          for p in fichiers:
              base = os.path.dirname(p)
              texte = open(p, encoding='utf-8', errors='replace').read()
              # liens inline : [texte](cible)
              for m in re.finditer(r'\[[^\]\n]*\]\(([^()\s]+)\)', texte):
                  c = m.group(1).split('#')[0]
                  if not c or c.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not existe(base, c):
                      casses.append('%s -> %s' % (p, m.group(1)))
              # definitions de liens de reference : [ref]: cible
              definitions = {}
              for m in re.finditer(r'^\s{0,3}\[([^\]]+)\]:\s*(\S+)', texte, re.M):
                  definitions[m.group(1).lower()] = m.group(2)
              # usages [texte][ref] : la definition doit exister
              for m in re.finditer(r'\[[^\]\n]*\]\[([^\]]+)\]', texte):
                  ref = m.group(1).lower()
                  if ref not in definitions:
                      casses.append('%s -> reference [%s] non definie' % (p, m.group(1)))
              # les definitions doivent pointer sur un fichier existant
              for ref, c in definitions.items():
                  c2 = c.split('#')[0]
                  if not c2 or c2.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not existe(base, c2):
                      casses.append('%s -> %s (definition [%s])' % (p, c, ref))

          if casses:
              print('Liens relatifs casses :')
              print('\n'.join(casses))
              sys.exit(1)
          print('Tous les liens relatifs des .md sont valides.')
          PY
