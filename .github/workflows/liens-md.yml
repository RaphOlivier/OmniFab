name: Controle des liens Markdown

# Verifie que tous les liens relatifs des .md du depot existent (README, docs/, AGENTS.md).
# PREPARE le 2026-10-26 — declenchement volontaire uniquement (workflow_dispatch)
# tant que la CI est rouge (Cargo.lock) ; a activer (on.push.paths: ["**/*.md"])
# une fois la CI repassee au vert. Ne cree PAS d'issue : echec visible dans Actions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    name: liens relatifs .md (docs/, README, AGENTS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verification des liens relatifs
        run: |
          set -eu
          CASSES=$(mktemp)
          # liens relatifs dans tous les .md du depot (hors target/) ;
          # collecte dans un fichier : une variable modifiee dans un pipe
          # reste dans son sous-shell et ne remonte jamais au parent
          while IFS= read -r f; do
            dir=$(dirname "$f")
            grep -oE '\[[^]]*\]\([^)#]+(#[^)]*)?\)' "$f" 2>/dev/null | sed -E 's/^\[[^]]*\]\(//; s/\)$//' | while IFS='#' read -r cible _; do
              case "$cible" in
                http* | mailto:* | "") continue ;;
              esac
              if [ ! -e "$dir/$cible" ]; then
                echo "$f -> $cible" >> "$CASSES"
              fi
            done
          done < <(find . -name '*.md' -not -path './target/*')
          if [ -s "$CASSES" ]; then
            echo "Liens relatifs casses :"
            cat "$CASSES"
            exit 1
          fi
          echo "Tous les liens relatifs des .md sont valides."
