name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"

concurrency:
  # Anti-file : un seul run actif par branche, les runs obsoletes sont annules
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # occt-sys 7.8.1 builtin : CMake >= 4 (runners 2026) refuse le
  # cmake_minimum_required(< 3.5) d'OCCT 7.8 — fixe build macos/windows (#452, #453).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: read
  issues: write

jobs:
  lint-test:
    name: fmt + clippy + tests + rustdoc (Linux)
    # ubuntu-26.04 : Linux recent pour planegcs/bindgen. OCCT ne vient
    # plus d'apt : occt-sys 7.8.1 builtin est epingle par le lock
    # (checkpoint d5b4b2c) et compile depuis les sources.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependances natives (planegcs + bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libeigen3-dev libfmt-dev libboost-dev libclang-dev cmake
      - name: Verifications
        id: verifs
        run: |
          set -u
          FAIL=0
          run_check() {
            name="$1"; shift
            echo "::group::$name"
            if "$@" >"$name.log" 2>&1; then
              echo "$name : OK"
            else
              echo "$name : ECHEC (code $?)"
              FAIL=1
            fi
            echo "::endgroup::"
          }
          run_check fmt cargo fmt --all -- --check
          run_check clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          run_check test cargo test --workspace --locked
          run_check doc env "RUSTDOCFLAGS=-D warnings" cargo doc --workspace --no-deps
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Rapport d'erreurs (issue)
        if: steps.verifs.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "Echec des verifications CI sur le job **lint-test** - commit $SHORT - [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            for f in clippy.log fmt.log test.log doc.log; do
              [ -s "$f" ] || continue
              echo ""
              echo "### $f (120 dernieres lignes)"
              echo '```text'
              tail -n 120 "$f"
              echo '```'
            done
          } > rapport-complet.md
          head -c 55000 rapport-complet.md > rapport.md
          cat rapport.md
          gh issue create --title "CI : echec lint-test @ $SHORT (run $GITHUB_RUN_ID)" --body-file rapport.md || echo "Impossible de creer l'issue de rapport"
      - name: Marquer le job en echec
        if: steps.verifs.outputs.fail == '1'
        run: |
          echo "Des verifications ont echoue - voir l'issue de rapport."
          exit 1

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache vcpkg (boost/eigen/fmt pour planegcs)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          key: vcpkg-planegcs-x64-windows-static-md
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
      - name: Dependances natives (planegcs + bindgen, ${{ matrix.os }})
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libeigen3-dev libfmt-dev libboost-dev libclang-dev cmake
              ;;
            macos-*)
              brew install eigen fmt boost llvm
              # eigen est keg-only : on le rend découvrable par CMake.
              echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen)" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
              ;;
            windows-*)
              # vcpkg est préinstallé sur les runners Windows ; triplet
              # statique/MD : liaison statique de planegcs sans DLL à copier.
              # OCCT n'est plus installe : occt-sys 7.8.1 builtin,
              # epingle par le lock, compile depuis les sources.
              "${VCPKG_INSTALLATION_ROOT}/vcpkg.exe" install \
                --triplet x64-windows-static-md boost-graph eigen3 fmt
              echo "VCPKG_TARGET_TRIPLET=x64-windows-static-md" >> "$GITHUB_ENV"
              choco install llvm -y --no-progress
              echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
              # REDUCTION DOCUMENTEE (ADR-0023 D8, validee par Raphael le
              # 2026-10-28) : forge-cad est exclu sous Windows tant que
              # opencascade-sys 0.3.0 ne compile pas sous MSVC (pont cxx,
              # b_rep.hxx C2440 handle->unique_ptr, upstream #234). Reversible
              # au premier fix upstream (ligne de veille OCCT). Jamais de
              # continue-on-error silencieux : l'exclusion est explicite,
              # le reste du workspace (desktop inclus) reste builde.
              echo "EXCLUDES_BUILD=--exclude forge-cad" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Compilation
        id: compil
        shell: bash
        run: |
          if cargo build --workspace --locked ${EXCLUDES_BUILD:-} > build.log 2>&1; then
            echo "fail=0" >> "$GITHUB_OUTPUT"
          else
            echo "fail=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Rapport d'erreurs (issue)
        if: steps.compil.outputs.fail == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "Echec de compilation CI sur le job **build (${{ matrix.os }})** - commit $SHORT - [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo '```text'
            tail -n 150 build.log
            echo '```'
          } > rapport.md
          cat rapport.md
          gh issue create --title "CI : echec build (${{ matrix.os }}) @ $SHORT (run $GITHUB_RUN_ID)" --body-file rapport.md || echo "Impossible de creer l'issue de rapport"
      - name: Marquer le job en echec
        if: steps.compil.outputs.fail == '1'
        shell: bash
        run: |
          echo "La compilation a echoue - voir l'issue de rapport."
          exit 1

  check-aarch64:
    name: check aarch64 (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cible aarch64 sur le toolchain epingle (rust-toolchain.toml)
        # rustup resout le toolchain depuis rust-toolchain.toml (cwd = depot) :
        # la cible installee par dtolnay@stable reste sur stable, pas sur le 1.99.1 epingle — fixe #451.
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Verification croisee
        id: cross
        run: |
          # forge-gcs, forge-gcs-sys et omnifab-desktop sont exclus
          # de la vérification croisée : planegcs est du C++ natif, le
          # cross-build CMake (Eigen3/fmt/g++ cross) est hors du
          # périmètre du spike (ADR-0013) ; l'app desktop dépend du
          # solveur natif (ADR-0018 lot 3b), elle est donc exclue
          # avec lui. forge-cad est exclu : son OCCT builtin (occt-sys
          # 7.8.1, epingle par le lock) compilerait C++ natif pour
          # aarch64 — hors périmètre du spike ; la crate reste
          # vérifiée sur les trois OS du job build.
          if cargo check --workspace --locked --exclude forge-gcs --exclude forge-gcs-sys --exclude omnifab-desktop --exclude forge-cad --target aarch64-unknown-linux-gnu > aarch64.log 2>&1; then
            echo "fail=0" >> "$GITHUB_OUTPUT"
          else
            echo "fail=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Rapport d'erreurs (issue)
        if: steps.cross.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "Echec de la verification croisee aarch64 - commit $SHORT - [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo '```text'
            tail -n 150 aarch64.log
            echo '```'
          } > rapport.md
          cat rapport.md
          gh issue create --title "CI : echec check aarch64 @ $SHORT (run $GITHUB_RUN_ID)" --body-file rapport.md || echo "Impossible de creer l'issue de rapport"
      - name: Marquer le job en echec
        if: steps.cross.outputs.fail == '1'
        run: |
          echo "La verification croisee a echoue - voir l'issue de rapport."
          exit 1
