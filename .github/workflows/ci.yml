name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + tests + rustdoc (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatage (rustfmt)
        run: cargo fmt --all -- --check
      - name: Linter (clippy, warnings bloquants)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (dont vérification du registre docs/error-codes.md)
        run: cargo test --workspace
      - name: Rustdoc (warnings bloquants)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilation
        run: cargo build --workspace

  check-aarch64:
    name: check aarch64 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Vérification croisée
        run: cargo check --workspace --target aarch64-unknown-linux-gnu
