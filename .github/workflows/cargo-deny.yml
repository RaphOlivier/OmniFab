# Audit supply-chain des dépendances (revue point 13, docs/ci-cargo-deny.md).
# Activé le 2026-10-29 (décision Raphaël, audit n°4 A4-12). ci.yml reste inchangé ;
# ce workflow ne crée jamais d'issue — un échec est visible dans le run.
name: cargo-deny

on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "deny.toml", ".github/workflows/cargo-deny.yml"]
  pull_request:
    paths: ["Cargo.lock", "deny.toml", ".github/workflows/cargo-deny.yml"]
  workflow_dispatch:

jobs:
  deny:
    name: cargo-deny (licences + advisories + sources + bans)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Licences
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: licenses
      - name: Advisories (CVE)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: advisories
      - name: Sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: sources
      - name: Bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: bans
