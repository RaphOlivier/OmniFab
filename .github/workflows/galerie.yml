name: Galerie de captures

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - ".github/workflows/galerie.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

permissions:
  contents: write
  issues: write

concurrency:
  group: galerie
  cancel-in-progress: false

jobs:
  captures:
    name: captures Xvfb (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependances natives (planegcs + bindgen + Xvfb + captures)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libeigen3-dev libfmt-dev libboost-dev libclang-dev \
            xvfb imagemagick mesa-vulkan-drivers libgl1 x11-utils \
            libxkbcommon-x11-0
      - name: Compilation du demonstrateur
        run: cargo build -p omnifab-desktop --locked
      - name: Captures des scenarios
        id: captures
        run: |
          set -u
          mkdir -p galerie
          cat > galerie-captures.sh <<'SCRIPT'
          #!/usr/bin/env bash
          scenario="$1"
          OMNIFAB_DEMO="$scenario" ./target/debug/omnifab-desktop > "galerie/app-$scenario.log" 2>&1 &
          PID=$!
          sleep 15
          echo "--- fenetres X ---"
          xwininfo -root -tree 2>&1 | head -n 30
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ECHEC : l'application est morte avant la capture"
            tail -n 60 "galerie/app-$scenario.log" 2>/dev/null || true
            exit 1
          fi
          import -window root "galerie/$scenario.png"
          RC=$?
          kill "$PID" 2>/dev/null || true
          echo "--- log de l'application (30 dernieres lignes) ---"
          tail -n 30 "galerie/app-$scenario.log" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "ECHEC : import a echoue (code $RC)"
            exit "$RC"
          fi
          if [ ! -f "galerie/$scenario.png" ]; then
            echo "ECHEC : capture absente"
            exit 1
          fi
          mean=$(identify -format '%[fx:mean]' "galerie/$scenario.png")
          echo "luminosite moyenne de la capture : $mean"
          noire=$(awk -v m="$mean" 'BEGIN { print (m + 0 < 0.02) ? 1 : 0 }')
          if [ "$noire" = "1" ]; then
            echo "ECHEC : capture noire (mean $mean)"
            exit 1
          fi
          SCRIPT
          chmod +x galerie-captures.sh
          FAIL=0
          for scenario in accueil atelier-2d atelier-3d; do
            echo "::group::capture $scenario"
            if xvfb-run -a -s "-screen 0 1280x800x24" ./galerie-captures.sh "$scenario"; then
              echo "capture $scenario : OK"
            else
              echo "capture $scenario : ECHEC (code $?)"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          ls -l galerie/ || true
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Artefact galerie-captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galerie-captures
          path: galerie/
          if-no-files-found: warn
      - name: Archivage durable (branche galerie)
        if: steps.captures.outputs.fail != '1'
        run: |
          set -eu
          DATE=$(date -u +%F)
          SHORT=$(git rev-parse --short HEAD)
          DOSSIER="captures/$DATE-$SHORT"
          # recuperer la branche galerie, ou la creer orpheline au premier archivage
          if git fetch origin galerie 2>/dev/null; then
            git checkout -B galerie origin/galerie -- 2>/dev/null || git checkout -B galerie origin/galerie
          else
            git checkout -B galerie --orphan
            git rm -rf --quiet . || true
            cat > README.md <<'MDEOF'
          # Galerie visuelle d'OmniFab

          Historique visuel de l'application, capturé automatiquement par
          `.github/workflows/galerie.yml` à chaque évolution du code poussée
          sur `main` (scénarios Xvfb : accueil, atelier-2d, atelier-3d).

          - `captures/<date>-<sha court>/` — un dossier par lot de code,
            nommé par la date du commit et son SHA court.
          - Les images sont ajoutées, jamais remplacées : l'historique
            complet de l'évolution visuelle se lit commit par commit.

          Le dépôt `main` reste la seule source de vérité du code ; cette
          branche ne contient que des captures.
          MDEOF
          fi
          mkdir -p "$DOSSIER"
          cp galerie/*.png "$DOSSIER/"
          # index du lot, avec un regard arriere vers le lot precedent
          {
            echo "# Lot $DATE - $SHORT"
            echo ""
            echo "Captures du commit [`$SHORT`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)) (run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo ""
            for f in "$DOSSIER"/*.png; do
              echo "- [`$(basename "$f")`]($f)"
            done
          } > "$DOSSIER/INDEX.md"
          git add captures
          git add README.md 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "captures $DATE @ $SHORT"
          git push origin galerie
      - name: Rapport d'erreurs (issue)
        if: steps.captures.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "Echec de la galerie de captures sur le job **captures** - commit $SHORT - [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            for f in galerie/*.log; do
              [ -s "$f" ] || continue
              echo ""
              echo "### $f (120 dernieres lignes)"
              echo '~~~text'
              tail -n 120 "$f"
              echo '~~~'
            done
          } > rapport.md
          head -c 55000 rapport.md > rapport2.md
          cat rapport2.md
          gh issue create --title "CI : echec galerie de captures @ $SHORT (run $GITHUB_RUN_ID)" --body-file rapport2.md || echo "Impossible de creer l'issue de rapport"
      - name: Marquer le job en echec
        if: steps.captures.outputs.fail == '1'
        run: |
          echo "La galerie de captures a echoue - voir l'issue de rapport."
          exit 1
