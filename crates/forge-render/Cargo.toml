[package]
name = "forge-render"
description = "Viewport wgpu : scène 2D, caméra et pipeline des tracés (ADR-0015, phase C1)."
license = "MPL-2.0"
repository = "https://github.com/RaphOlivier/OmniFab"
version.workspace = true
edition.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.29", optional = true }
egui-wgpu = { version = "0.29", optional = true }
forge-geom = { path = "../forge-geom" }
# Pas de features par défaut : leur backend dx12 ajouterait d3d12 et range-alloc
# au graphe de dépendances, que le lock (eframe tire wgpu sans défauts) ne
# contient pas ; les backends natifs restent fournis par l'hôte (ADR-0015).
wgpu = { version = "22", default-features = false, features = ["wgsl"] }

[dev-dependencies]
forge-units = { path = "../forge-units" }

[features]
# Adaptateur egui_wgpu::CallbackTrait : le cœur de la crate ne dépend
# pas d'egui (ADR-0015).
egui = ["dep:egui", "dep:egui-wgpu"]

[lints]
workspace = true
