[package]
name = "forge-doc"
description = "Conteneur ZIP versionné et journal d'événements JSON Lines (event sourcing) — ADR-0000 verrous 1-2, ADR-0001."
license = "MPL-2.0"
repository = "https://github.com/RaphOlivier/OmniFab"
version.workspace = true
edition.workspace = true

[features]
default = ["native"]
# Accès fichier natif (save/open sur disque). Le noyau conteneur reste en
# mémoire et fonctionne aussi en wasm (ADR-0000 : feature flags native/wasm).
native = []
wasm = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true
log.workspace = true
uuid.workspace = true
