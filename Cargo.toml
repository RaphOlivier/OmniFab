[workspace]
resolver = "2"
members = [
    "apps/omnifab-android",
    "apps/omnifab-desktop",
    "crates/forge-cad",
    "crates/forge-doc",
    "crates/forge-gcs",
    "crates/forge-gcs-sys",
    "crates/forge-geom",
    "crates/forge-i18n",
    "crates/forge-io",
    "crates/forge-render",
    "crates/forge-session",
    "crates/forge-units",
    "crates/forge-values",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# Dépendances partagées du noyau (frontières : cf. docs/architecture.md, garde-fou).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
libm = "0.2"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"

# Convention expect v2 (2026-10-31, lot E) : expect_used en warn au
# niveau du workspace — bascule "deny" au lot suivant. Les
# échappatoires datées vivent près des sites (#[expect]) ; les
# tests sont exemptés via clippy.toml (allow-expect-in-tests),
# build.rs via un allow daté.
[workspace.lints.clippy]
expect_used = "warn"
