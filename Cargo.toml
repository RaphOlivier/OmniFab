[workspace]
resolver = "2"
members = [
    "apps/omnifab-android",
    "apps/omnifab-desktop",
    "crates/forge-doc",
    "crates/forge-session",
    "crates/forge-units",
    "crates/forge-values",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Dépendances partagées du noyau (frontières : cf. docs/architecture.md, garde-fou).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
libm = "0.2"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
