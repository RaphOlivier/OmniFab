# Configuration cargo-deny (revue point 13).
# Usage local : cargo install cargo-deny && cargo deny check
# Usage CI : workflow .github/workflows/cargo-deny.yml — activé le 2026-10-29
# (décision Raphaël, audit n°4 A4-12) ; ci.yml reste inchangé.

[graph]
all-features = true

[licenses]
# Noyau : GPL-3.0+ (racine) et crates MPL-2.0 ; dependances : MIT/Apache-2
# (eframe, serde, thiserror, zip, libm, sha2, uuid, log) + transitives.
# B5 (audit n°3, validé par Raphaël le 2026-10-26, corrigé le 2026-10-29) :
# la clé private = { workspace = true } (documentée dans la doc de
# développement cargo-deny, mais absente de la release 0.20.2 embarquée
# par l'action v2) faisait échouer le run : error[unexpected-keys]. Les
# membres du workspace sont donc vérifiés comme les autres : leurs
# licences sont des décisions du projet, toutes présentes dans l'allow
# ci-dessous (GPL-3.0-or-later racine et applications, LGPL-2.1-or-later
# forge-gcs/-sys — héritage planegcs, ADR-0013/ADR-0023 —, MPL-2.0 crates).
# A4-11 (audit n°4, reformulation validée par Raphaël le 2026-10-29) : OCCT
# est liée en STATIQUE (occt-sys 7.8.1 builtin, ADR-0023 D1 amendé) et
# planegcs + shim en statique (ADR-0013) — la conformité LGPL repose sur la
# distribution des SOURCES RECOMPILABLES de l'ensemble GPL-3.0+, pas sur une
# liaison dynamique ; GPL-3.0 = racine du projet.
# Relève CI du 2026-10-29 (PR #485, premier run réel du check) — ajouts :
# - BSL-1.0 (clipboard-win 5.4.1, error-code 3.4.0 — pile egui/arboard,
#   permissive OSI/FSF) ; CC0-1.0 (hexf-parse 0.2.1 — naga/wgpu, dédicace
#   de domaine public FSF-free, non-OSI : listée explicitement) ;
# - OFL-1.1 + LicenseRef-UFL-1.0 (epaint_default_fonts 0.29.1 — polices
#   embarquées d'egui, double licence SIL Open Font / Ubuntu Font) ;
# - héritage OCCT/planegcs : occt-sys 7.8.1, opencascade 0.3.0 et
#   opencascade-sys 0.3.0 déclarent « LGPL-2.1 » (identifiant SPDX
#   déprécié = 2.1 only) — cargo-deny >= 0.18.4 traite les licences GNU
#   pédantiquement : une crate déclarant la forme dépréciée ne peut être
#   matchée QUE par l'allow « LGPL-2.1 » littéral, jamais par
#   « LGPL-2.1-only » (doc licenses/cfg) — les deux formes sont donc
#   listées, sans élargissement de périmètre copyleft (assumé ADR-0013/
#   ADR-0023, B5 ci-dessus).
# Toute NOUVELLE dépendance tierce LGPL/GPL devra être ajoutée explicitement
# ici — la dérive reste visible. AGPL et non-listées : toujours refusées.
# Les allow non rencontrés (MIT-0, Unicode-DFS-2016, CDLA-Permissive-2.0,
# LGPL-2.1-only) ne produisent qu'un avertissement : conservés à titre
# préventif.
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "LGPL-2.1-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1",
  "GPL-3.0-or-later",
  "BSL-1.0",
  "CC0-1.0",
  "OFL-1.1",
  "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[advisories]
version = 2
yanked = "deny"
# Releve CI du 2026-10-29 (PR #485, premier run reel du check) : le
# passage Advisories revele 11 detections — 5 advisories unmaintained,
# 5 vulnerabilites et 1 version yankee. Aucune n'est corrigeable par un
# simple cargo update : toutes vivent dans des transitives de la pile
# UI (egui 0.29 / wgpu 22 / accesskit) epinglee par les versions
# majeures du projet. Chaque ignore est date et motive ; un ignore
# devenu inutile (dependance montee) ne produit qu'un avertissement
# « unused » — la derive reste visible. Le champ ignore_yanked est
# SEPARE en cargo-deny 0.20.2 (la doc en ligne, plus recente, fusionne
# les deux listes dans ignore — ne pas suivre, cf. cle private).
ignore = [
  # --- unmaintained : transitives verrouillees, « no safe upgrade »
  # (a revisiter a la prochaine montee d'egui/eframe) ---
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 : transitive de accesskit_windows 0.23 (egui-winit) et metal 0.29 (wgpu-hal) ; pas d'upgrade compatible dans egui 0.29 (2026-10-29)" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 : transitive de ab_glyph/epaint (egui 0.29) ; l'alternative skrifa suppose une montee d'egui (2026-10-29)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 4.2.0 : transitive de la pile accessibilite AT-SPI (zbus 4.4/accesskit) ; fusionnee dans zbus 6 = montee d'accesskit (2026-10-29)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 3.0.0 : idem zvariant, pile AT-SPI verrouillee par accesskit (2026-10-29)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 4.2.0 : idem zvariant, pile AT-SPI verrouillee par accesskit (2026-10-29)" },
  # --- quick-xml 0.30 : vulnerabilites de parsing d'XML non fiable
  # (DoS CPU/memoire). Surface reelle : accessibilite AT-SPI locale —
  # le XML traite vient des APIs D-Bus locales, jamais d'un document
  # distant ; les scenarios RPKI des advisories ne s'appliquent pas.
  # Fix >= 0.41.0 impossible : zbus_xml 4.0.0 exige quick-xml 0.30
  # (2026-10-29) ---
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.30 : attributs quadratiques (DoS CPU) — accessible uniquement via atspi/zbus sur XML local ; verrouille par zbus_xml 4.0.0 (2026-10-29)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.30 : declarations de namespaces non bornees (DoS memoire) — meme surface AT-SPI locale, verrouille par zbus_xml 4.0.0 (2026-10-29)" },
  # --- zip 2.4.2 : les 3 CVE ciblent exclusivement
  # ZipArchive::extract()/ZipStreamReader::extract() (extraction sur
  # disque). Code NON AFFECTE : forge-doc (seule crate a dependre de
  # zip) n'appelle jamais extract() — lecture ciblee by_name/by_index
  # en memoire, bornee par entree (OF-DOC-0011) et cumulée
  # (OF-DOC-0014), ecriture via ZipWriter en memoire. Dette : monter
  # zip en 9.x (Cargo.toml « 2 ») lors d'une passe dediee
  # (2026-10-29) ---
  { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2 : bits SUID/SGID preserves a l'extraction — extract() jamais appele (lecture bornee en memoire) ; dette : montee zip 9.x (2026-10-29)" },
  { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2 : symlinks hors destination a l'extraction — extract() jamais appele ; dette : montee zip 9.x (2026-10-29)" },
  { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2 : permissions appliquees via symlinks a l'extraction — extract() jamais appele ; dette : montee zip 9.x (2026-10-29)" },
]
# Version yankee du registry : arboard 3.6.1 accepte ^5.3.1 — a monter
# au prochain passage de mise a jour des dependances (l'ignore
# deviendra « unused » de lui-meme).
ignore_yanked = [
  { crate = "clipboard-win@5.4.1", reason = "version yankee du registry, transitive egui/arboard ; arboard accepte ^5.3.1, a monter au prochain cargo update (2026-10-29)" },
]

[bans]
# Les doublons de versions sont frequents dans l'ecosysteme winit/egui :
# signales sans faire echouer, a resserrer plus tard.
multiple-versions = "warn"
multiple-versions-include-dev = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
